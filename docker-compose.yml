version: '3.8'

services:
  doculoader:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AZURE_CONTENT_UNDERSTANDING_ENDPOINT=${AZURE_CONTENT_UNDERSTANDING_ENDPOINT}
      - AZURE_CONTENT_UNDERSTANDING_KEY=${AZURE_CONTENT_UNDERSTANDING_KEY}
      - AZURE_CONTENT_UNDERSTANDING_ANALYZER_ID=${AZURE_CONTENT_UNDERSTANDING_ANALYZER_ID:-prebuilt-documentSearch}
      - TEMP_WORK_DIR=/tmp/doculoader
    volumes:
      - temp-data:/tmp/doculoader
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  temp-data:
